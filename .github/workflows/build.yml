name: Build Services

on:
  push:
    branches: [main, master]
    paths:
      - 'services/user-service/**'
      - 'services/catalog-service/**'
      - 'services/order-service/**'
      - 'pkg/**'
      - 'api/**'
      - 'common/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    paths:
      - 'services/**'
      - 'pkg/**'
      - 'api/**'

jobs:
  build-user:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build user-service image
        run: docker build -f services/user-service/Dockerfile .

  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build catalog-service image
        run: docker build -f services/catalog-service/Dockerfile .

  build-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build order-service image
        run: docker build -f services/order-service/Dockerfile .

  build-pkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Verify pkg compiles
        run: go build ./pkg/...
