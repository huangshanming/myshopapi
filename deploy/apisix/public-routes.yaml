# 公开路由（无需 JWT）
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mymall-public-routes
  namespace: mymall
spec:
  ingressClassName: apisix
  http:
    - name: user-auth
      match:
        paths:
          - /api/v1/user/login
          - /api/v1/user/register
        methods:
          - POST
          - OPTIONS
      backends:
        - serviceName: user-service 
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true

    - name: product-reviews-public
      match:
        paths:
          - /api/v1/products/*/reviews
        methods:
          - GET
          - OPTIONS
      backends:
        - serviceName: order-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true

    - name: points-mall-uploads
      match:
        paths:
          - /uploads/points-mall
          - /uploads/points-mall/*
        methods:
          - GET
          - OPTIONS
      backends:
        - serviceName: user-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true

    - name: cps-acts-public
      match:
        paths:
          - /api/v1/user/cps/acts
          - /api/v1/user/cps/goods
        methods:
          - GET
          - OPTIONS
      backends:
        - serviceName: user-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true

    - name: catalog-read
      match:
        paths:
          - /api/v1/products/*
          - /api/v1/product_category/*
          - /api/v1/articles/list
          - /api/v1/articles/*
          - /api/v1/comment-emojis
          - /api/v1/banners
          - /uploads/*
        methods:
          - GET
          - OPTIONS
      backends:
        - serviceName: catalog-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true

    - name: shops-read
      match:
        paths:
          - /api/v1/shops
          - /api/v1/shops/*
          - /api/v1/home/theme-tiles
          - /api/v1/coupons/center
          - /api/v1/coupons/popup
          - /api/v1/seckill/current
          - /api/v1/seckill/list
          - /api/v1/seckill/entries
          - /api/v1/seckill/entries/*
        methods:
          - GET
          - OPTIONS
      backends:
        - serviceName: merchant-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5175,http://127.0.0.1:5175,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true
