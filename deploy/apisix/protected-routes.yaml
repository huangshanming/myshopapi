# 需要 JWT 鉴权的路由（profile、orders 等）
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mymall-protected-routes
  namespace: mymall
spec:
  ingressClassName: apisix
  http:
    - name: user-profile
      match:
        paths:
          - /api/v1/user/profile
        methods:
          - GET
          - PUT
          - DELETE
          - POST
          - OPTIONS
      backends:
        - serviceName: user-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true
        - name: jwt-auth
          enable: true
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local payload = ctx.var.jwt_payload
                  if payload and payload.user_id then
                    core.request.set_header(ctx, "X-User-Id", tostring(payload.user_id))
                  end
                  if payload and payload.role then
                    core.request.set_header(ctx, "X-User-Role", tostring(payload.role))
                  end
                  if payload and payload.shop_id then
                    core.request.set_header(ctx, "X-Shop-Id", tostring(payload.shop_id))
                  end
                end

    - name: orders
      match:
        paths:
          - /api/v1/orders
          - /api/v1/orders/*
        methods:
          - GET
          - POST
          - PUT
          - OPTIONS
      backends:
        - serviceName: order-service
          servicePort: 8888
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:9099,http://127.0.0.1:9099"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-User-Id,X-User-Role,X-Shop-Id"
            allow_credential: true
        - name: jwt-auth
          enable: true
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local payload = ctx.var.jwt_payload
                  if payload and payload.user_id then
                    core.request.set_header(ctx, "X-User-Id", tostring(payload.user_id))
                  end
                  if payload and payload.role then
                    core.request.set_header(ctx, "X-User-Role", tostring(payload.role))
                  end
                  if payload and payload.shop_id then
                    core.request.set_header(ctx, "X-Shop-Id", tostring(payload.shop_id))
                  end
                end
