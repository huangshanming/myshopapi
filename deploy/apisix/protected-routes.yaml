# 需要 JWT 鉴权的路由（profile、orders 等）
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: mymall-protected-routes
  namespace: mymall
spec:
  http:
    - name: user-profile
      match:
        paths:
          - /api/v1/user/profile
        methods:
          - GET
          - PUT
      backends:
        - serviceName: user-service
          servicePort: 8888
      plugins:
        - name: jwt-auth
          enable: true
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local payload = ctx.var.jwt_payload
                  if payload and payload.user_id then
                    core.request.set_header(ctx, "X-User-Id", tostring(payload.user_id))
                  end
                end

    - name: orders
      match:
        paths:
          - /api/v1/orders
          - /api/v1/orders/*
        methods:
          - GET
          - POST
          - PUT
      backends:
        - serviceName: order-service
          servicePort: 8888
      plugins:
        - name: jwt-auth
          enable: true
        - name: serverless-pre-function
          enable: true
          config:
            phase: rewrite
            functions:
              - |
                return function(conf, ctx)
                  local core = require("apisix.core")
                  local payload = ctx.var.jwt_payload
                  if payload and payload.user_id then
                    core.request.set_header(ctx, "X-User-Id", tostring(payload.user_id))
                  end
                end
