apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  namespace: mymall
data:
  config.yaml: |
    server:
      http_port: 8888
      grpc_port: 9090
      mode: release
    mysql:
      port: 3306
      charset: utf8mb4
      dbname: mymall
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 3600
      conn_max_idle_time: 3600
    redis:
      port: 6379
      db: 0
    rabbitmq:
      port: 5672
      vhost: /
      exchange: mymall.events
    telemetry:
      enabled: false
      service: catalog-service
