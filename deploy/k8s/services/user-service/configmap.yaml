# 非敏感配置；mysql/jwt 凭证由 Secret 注入 MYMALL_* 环境变量覆盖
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: mymall
data:
  user-service.yaml: |
    server:
      http_port: 8888
      grpc_port: 9090
      mode: release
    mysql:
      port: 3306
      charset: utf8mb4
      dbname: mymall
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 3600
      conn_max_idle_time: 3600
    jwt:
      expire_hours: 24
      issuer: mymall
