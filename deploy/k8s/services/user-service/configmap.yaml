# 非敏感配置；username/password/host 从 Secret 注入
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-service-config
  namespace: mymall
data:
  config.yaml: |
    server:
      http_port: 8888
      grpc_port: 9090
      mode: release
    mysql:
      port: 3306
      charset: utf8mb4
      dbname: user_db
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 3600
      conn_max_idle_time: 3600
    jwt:
      expire_hours: 24
      issuer: mymall
