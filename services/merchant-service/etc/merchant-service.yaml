# go-zero RestConf + business fields. Compose/K8s 仍可用 MYMALL_* 覆盖。
Name: merchant-service.api
Host: 0.0.0.0
Port: 8884
Mode: dev
Timeout: 30000
Log:
  Mode: console
  Encoding: plain

RpcListenOn: 0.0.0.0:9092
# Etcd:
#   Hosts:
#     - 127.0.0.1:2379

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Username: homestead
  Password: secret
  Dbname: mymall
  Charset: utf8mb4
  MaxOpenConns: 50
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 3600

AppTelemetry:
  Enabled: false
  Endpoint: jaeger-collector.mymall:4318
  Service: merchant-service

TencentMap:
  Key: "5Q7BZ-SA4W2-L62UO-CEVI7-GC75F-XBBD5"
  BaseURL: https://apis.map.qq.com
