# go-zero RestConf + business fields. Compose/K8s 仍可用 MYMALL_* 覆盖。
Name: catalog-service.api
Host: 0.0.0.0
Port: 8882
Mode: dev
Timeout: 30000
Log:
  Mode: console
  Encoding: plain

RpcListenOn: 0.0.0.0:9091
UserRpc: localhost:9090
# Etcd:
#   Hosts:
#     - 127.0.0.1:2379

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Username: homestead
  Password: secret
  Dbname: mymall
  Charset: utf8mb4
  MaxOpenConns: 50
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 3600

Redis:
  Host: 127.0.0.1
  Port: 6379
  Password: ""
  DB: 0

RabbitMQ:
  Host: 127.0.0.1
  Port: 5672
  Username: mymall
  Password: mymall
  Vhost: /
  Exchange: mymall.events

Telemetry:
  Enabled: false
  Endpoint: jaeger-collector.mymall:4318
  Service: catalog-service
