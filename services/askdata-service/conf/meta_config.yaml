      - name: order_id
        role: foreign_key
        description: 关联订单 ID，关联 orders.id。
        alias: [售后订单ID]
        sync: false

      - name: order_no
        role: dimension
        description: 关联业务订单号，便于按订单号查售后。
        alias: [售后订单号]
        sync: true

      - name: user_id
        role: foreign_key
        description: 申请用户 ID，关联 users.id；按用户名过滤须再 JOIN users。
        alias: [售后用户ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 店铺 ID，关联 shops.id；按店名/地区过滤须再 JOIN shops。
        alias: [售后店铺ID]
        sync: false

      - name: type
        role: dimension
        description: 售后类型，如 refund（仅退款）、return_refund（退货退款）。
        alias: [售后类型]
        sync: true

      - name: reason
        role: dimension
        description: 售后原因。
        alias: [售后原因, 退款原因]
        sync: true

      - name: amount
        role: measure
        description: 售后申请/退款金额。
        alias: [退款金额, 售后金额]
        sync: true

      - name: status
        role: dimension
        description: 售后状态：pending/approved/rejected/refunded/closed。
        alias: [售后状态]
        sync: true

      - name: admin_remark
        role: dimension
        description: 处理备注。
        alias: [售后处理备注]
        sync: false

      - name: handled_by
        role: dimension
        description: 处理人用户 ID。
        alias: [售后处理人]
        sync: false

      - name: created_at
        role: dimension
        description: 售后申请时间。
        alias: [售后申请时间]
        sync: true

      - name: updated_at
        role: dimension
        description: 售后更新时间。
        alias: [售后更新时间]
        sync: false

  - name: product_reviews
    role: fact
    description: >
