      - name: coupon_id
        role: foreign_key
        description: 券模板 ID，关联 coupons.id。
        alias: [所属券模板ID]
        sync: false

      - name: user_id
        role: foreign_key
        description: 持有用户 ID，关联 users.id；按昵称过滤须 JOIN users。
        alias: [领券用户ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 关联店铺 ID。
        alias: [用户券店铺ID]
        sync: false

      - name: status
        role: dimension
        description: 用户券状态：unused-未用 locked-锁定 used-已用 expired-过期。
        alias: [用户券状态, 券使用状态]
        sync: true

      - name: source
        role: dimension
        description: 领取来源：direct/order_gift/popup/targeted。
        alias: [领券来源]
        sync: true

      - name: valid_start
        role: dimension
        description: 该张券可用开始时间。
        alias: [用户券开始时间]
        sync: true

      - name: valid_end
        role: dimension
        description: 该张券可用结束时间。
        alias: [用户券结束时间]
        sync: true

      - name: order_id
        role: foreign_key
        description: 核销关联订单 ID；未使用为 0。
        alias: [用券订单ID]
        sync: false

      - name: used_at
        role: dimension
        description: 核销时间。
        alias: [用券时间, 核销时间]
        sync: true

      - name: discount_amount
        role: measure
        description: 核销时实际抵扣金额。
        alias: [实际抵扣金额, 用券抵扣]
        sync: true

      - name: created_at
        role: dimension
        description: 领券时间。
        alias: [领券时间]
        sync: true

  - name: coupon_redeem_logs
    role: fact
    description: >
      优惠券核销流水（redeem/unlock/return）。统计实际抵扣、核销次数时用本表；
