# 电商问数 — 业务元数据（语义层）
# 物理库：mymall（db_meta / db_dw 当前均指向同一 OLTP）
# 约定：
#   table.role: dim | fact
#   column.role: primary_key | foreign_key | dimension | measure
#   column.sync: 是否同步字段值到向量/检索知识库（PII、密钥、大文本建议 false）
#   metrics.relevant_columns: 使用 表名.字段名
# 描述写作（供召回/过滤/生成 SQL）：
#   - 写清「何时必须用本表/字段」与主关联键，避免 LLM 只留 fact 外键而丢掉维表
#   - 实体定位字段（nickname、店名、省市区、品名等）写明自然语言过滤场景
#   - FK 写明「仅 ID、按名称过滤须 JOIN 维表」

tables:
  - name: users
    role: dim
    description: >
      C 端买家/用户维表。用途：（1）按昵称、手机号定位具体用户，再经 users.id = orders.user_id
      （或售后/评价/收藏/券等事实表的 user_id）关联交易与行为；（2）用户数、新增、性别/角色等画像统计。
      问题中出现具体用户名/昵称/手机号时必须选用本表；仅有 orders.user_id 无法按名称过滤。
    columns:
      - name: id
        role: primary_key
        description: 用户主键。事实表 user_id 外键指向此字段；按昵称/手机号定位后用 id 关联订单等。
        alias: [用户ID, 买家ID]
        sync: false

      - name: mobile
        role: dimension
        description: 登录手机号（11 位）。按手机号定位用户时使用；与订单收货手机号 receiver_phone 不同。
        alias: [用户手机号, 手机号]
        sync: false

      - name: nickname
        role: dimension
        description: >
          用户昵称/展示名。自然语言中「用户 sam」「买家某某」等按名称定位人时的主过滤字段，
          常与 orders.user_id JOIN；不可用 orders 表单独替代。
        alias: [用户昵称, 账号名称, 买家昵称]
        sync: true

      - name: avatar
        role: dimension
        description: 用户头像 URL，一般不参与统计过滤。
        alias: [用户头像]
        sync: false

      - name: gender
        role: dimension
        description: 性别：0-未知 1-男 2-女。用于按性别分组或筛选用户。
        alias: [用户性别, 性别]
        sync: true

      - name: status
        role: dimension
        description: 账号状态：1-正常 0-禁用。统计有效用户时常过滤 status=1。
        alias: [用户状态, 账号状态]
        sync: true

      - name: role
        role: dimension
        description: 系统角色，如 user、admin。区分普通买家与管理员账号。
        alias: [用户角色]
        sync: true

      - name: last_login_time
        role: dimension
        description: 最后登录时间，用于活跃/沉默用户分析。
        alias: [最后登录时间, 最近登录]
        sync: false

      - name: created_at
        role: dimension
        description: 注册时间。统计新增用户、按注册时段分析时使用。
        alias: [注册时间, 用户创建时间]
        sync: true

      - name: updated_at
        role: dimension
        description: 资料最近更新时间。
        alias: [用户更新时间]
        sync: false

      - name: deleted_at
        role: dimension
        description: 软删除时间；非空表示已删除，统计有效用户时应排除。
        alias: [用户删除时间]
        sync: false

  - name: shops
    role: dim
    description: >
      商家/门店维表。用途：（1）按店名、省市区定位店铺；（2）区域销售分析——地理维度在本表
      province/city/district，需 JOIN orders.shop_id 或 products.shop_id；（3）店铺状态、经营类目分析。
      问「某地区/某省/某店销售额」时必须选用本表，不能只用 orders。
    columns:
      - name: id
        role: primary_key
        description: 店铺主键。orders.shop_id、products.shop_id 等外键指向此字段。
        alias: [店铺ID, 商家ID, 门店ID]
        sync: false

      - name: name
        role: dimension
        description: 店铺名称。按店名/商家名定位店铺时的主过滤字段。
        alias: [店铺名称, 店名, 商家名称]
        sync: true

      - name: logo
        role: dimension
        description: 店铺 Logo URL。
        alias: [店铺Logo]
        sync: false

      - name: contact_name
        role: dimension
        description: 联系人姓名。
        alias: [店铺联系人]
        sync: false

      - name: contact_phone
        role: dimension
        description: 联系电话。
        alias: [店铺电话, 商家手机号]
        sync: false

      - name: description
        role: dimension
        description: 店铺简介。
        alias: [店铺简介]
        sync: false

      - name: category
        role: dimension
        description: 经营类目（文本）。
        alias: [经营类目, 店铺类目]
        sync: true

      - name: province
        role: dimension
        description: >
          店铺所在省份。区域/大区销售筛选的主字段（如「华北」通常对应北京、天津、河北、山西、内蒙古等）；
          需与 orders/products 通过 shop_id 关联后过滤。
        alias: [店铺省份, 省, 地区, 区域]
        sync: true

      - name: city
        role: dimension
        description: 店铺所在城市。按城市筛选或下钻区域分析时使用。
        alias: [店铺城市, 市]
        sync: true

      - name: district
        role: dimension
        description: 店铺所在区/县。更细粒度的地理筛选。
        alias: [店铺区县, 区]
        sync: true

      - name: address
        role: dimension
        description: 详细地址。
        alias: [店铺地址]
        sync: false

      - name: latitude
        role: measure
        description: 纬度。
        alias: [店铺纬度]
        sync: false

      - name: longitude
        role: measure
        description: 经度。
        alias: [店铺经度]
        sync: false

      - name: local_enabled
        role: dimension
        description: 是否展示在本地商家：1-是 0-否。
        alias: [本地商家, 是否本地店]
        sync: true

      - name: business_license_no
        role: dimension
        description: 营业执照号。
        alias: [营业执照号]
        sync: false

      - name: legal_person
        role: dimension
        description: 法人姓名。
        alias: [法人]
        sync: false

      - name: owner_user_id
        role: foreign_key
        description: 店主用户 ID，关联 users.id。
        alias: [店主用户ID, 店主ID]
        sync: false

      - name: status
        role: dimension
        description: 店铺状态：pending-待审 approved-已通过 rejected-已拒绝 disabled-已禁用。
        alias: [店铺状态, 商家状态]
        sync: true

      - name: reject_reason
        role: dimension
        description: 审核拒绝原因。
        alias: [店铺拒绝原因]
        sync: false

      - name: created_at
        role: dimension
        description: 店铺创建时间。
        alias: [开店时间, 店铺创建时间]
        sync: true

      - name: updated_at
        role: dimension
        description: 店铺更新时间。
        alias: [店铺更新时间]
        sync: false

  - name: product_categories
    role: dim
    description: >
      商品分类维表（多级类目）。按类目名称/层级分析商品分布与品类销售时使用；
      经 products.category_id = product_categories.id 关联商品，再经订单明细关联销售。
    columns:
      - name: id
        role: primary_key
        description: 分类主键。products.category_id 指向此字段。
        alias: [分类ID, 类目ID]
        sync: false

      - name: parent_id
        role: foreign_key
        description: 父分类 ID，0 表示顶级类目；用于树形类目展开。
        alias: [父分类ID, 上级类目]
        sync: false

      - name: name
        role: dimension
        description: 分类/品类名称。按「某品类」「某类目」过滤时的主字段。
        alias: [分类名称, 类目名称, 品类]
        sync: true

      - name: description
        role: dimension
        description: 分类描述。
        alias: [分类描述]
        sync: false

      - name: sort_order
        role: measure
        description: 排序值，越小越靠前。
        alias: [分类排序]
        sync: false

      - name: level
        role: dimension
        description: 分类层级，从 1 开始。
        alias: [分类层级]
        sync: true

      - name: is_show
        role: dimension
        description: 是否前台展示：1-是 0-否。
        alias: [分类是否显示]
        sync: true

      - name: product_count
        role: measure
        description: 该分类下商品数量（冗余计数）。
        alias: [分类商品数]
        sync: true

      - name: created_at
        role: dimension
        description: 分类创建时间。
        alias: [分类创建时间]
        sync: false

  - name: products
    role: dim
    description: >
      商品 SPU 维表。按商品名/货号定位商品，查询售价、库存汇总、运营标签（热销/新品等）；
      精细库存优先看 product_skus。经 shop_id 关联店铺、category_id 关联类目；销量拆解通常走 order_items。
    columns:
      - name: id
        role: primary_key
        description: 商品主键。order_items.product_id、product_skus.product_id 等指向此字段。
        alias: [商品ID, SPU_ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 所属店铺 ID，关联 shops.id。按店铺看商品时 JOIN shops。
        alias: [商品店铺ID]
        sync: false

      - name: product_no
        role: dimension
        description: 商品业务编号/货号。按货号定位商品时使用。
        alias: [商品编号, 货号]
        sync: true

      - name: name
        role: dimension
        description: 商品名称。按品名定位或展示时的主字段；历史成交品名快照见 order_items.product_name。
        alias: [商品名称, 品名]
        sync: true

      - name: subtitle
        role: dimension
        description: 商品副标题。
        alias: [商品副标题]
        sync: true

      - name: description
        role: dimension
        description: 商品详情描述。
        alias: [商品描述, 商品详情]
        sync: false

      - name: market_price
        role: measure
        description: 市场价/划线价。
        alias: [市场价, 原价, 划线价]
        sync: true

      - name: sale_price
        role: measure
        description: 销售价。
        alias: [销售价, 售价, 单价]
        sync: true

      - name: cost_price
        role: measure
        description: 成本价。
        alias: [成本价]
        sync: false

      - name: discount
        role: measure
        description: 折扣百分比，100 表示无折扣。
        alias: [折扣, 折扣百分比]
        sync: true

      - name: discount_price
        role: measure
        description: 折后价。
        alias: [折后价]
        sync: true

      - name: stock
        role: measure
        description: 商品级库存汇总（展示用）；精细库存见 product_skus.stock。
        alias: [商品库存, 库存数量]
        sync: true

      - name: stock_warn
        role: measure
        description: 库存预警阈值。
        alias: [库存预警值, 低库存阈值]
        sync: true

      - name: sold_count
        role: measure
        description: 已售数量（累计）。
        alias: [销量, 已售数量, 销售件数]
        sync: true

      - name: view_count
        role: measure
        description: 浏览次数。
        alias: [浏览量, PV]
        sync: true

      - name: collect_count
        role: measure
        description: 收藏次数。
        alias: [收藏数]
        sync: true

      - name: avg_rating
        role: measure
        description: 平均评分（1–5）。
        alias: [平均评分, 商品评分]
        sync: true

      - name: review_count
        role: measure
        description: 评价条数。
        alias: [评价数, 评论数]
        sync: true

      - name: good_rate
        role: measure
        description: 好评率（百分比）。
        alias: [好评率]
        sync: true

      - name: pet_type
        role: dimension
        description: 适用宠物类型：dog/cat/both/other。
        alias: [宠物类型, 适用宠物]
        sync: true

      - name: brand_id
        role: foreign_key
        description: 品牌 ID。
        alias: [品牌ID]
        sync: false

      - name: category_id
        role: foreign_key
        description: 分类 ID，关联 product_categories.id。
        alias: [商品分类ID, 类目ID]
        sync: false

      - name: product_type
        role: dimension
        description: 商品类型：physical-实物 fresh-生鲜 virtual-虚拟。
        alias: [商品类型]
        sync: true

      - name: weight
        role: measure
        description: 重量（kg）。
        alias: [商品重量]
        sync: false

      - name: unit
        role: dimension
        description: 计量单位。
        alias: [商品单位]
        sync: true

      - name: status
        role: dimension
        description: 商品状态：draft-草稿 on_sale-在售 off_sale-下架 deleted-已删。
        alias: [商品状态, 上架状态]
        sync: true

      - name: is_hot
        role: dimension
        description: 是否热销：1-是 0-否。
        alias: [是否热销, 热销]
        sync: true

      - name: is_new
        role: dimension
        description: 是否新品：1-是 0-否。
        alias: [是否新品, 新品]
        sync: true

      - name: is_recommend
        role: dimension
        description: 是否推荐：1-是 0-否。
        alias: [是否推荐, 推荐商品]
        sync: true

      - name: is_prescription
        role: dimension
        description: 是否处方粮：1-是 0-否。
        alias: [是否处方粮]
        sync: true

      - name: is_imported
        role: dimension
        description: 是否进口：1-是 0-否。
        alias: [是否进口]
        sync: true

      - name: is_organic
        role: dimension
        description: 是否有机：1-是 0-否。
        alias: [是否有机]
        sync: true

      - name: is_grain_free
        role: dimension
        description: 是否无谷：1-是 0-否。
        alias: [是否无谷]
        sync: true

      - name: publish_time
        role: dimension
        description: 实际上架时间。
        alias: [上架时间, 发布时间]
        sync: true

      - name: schedule_on_at
        role: dimension
        description: 定时上架时间。
        alias: [定时上架时间]
        sync: false

      - name: schedule_off_at
        role: dimension
        description: 定时下架时间。
        alias: [定时下架时间]
        sync: false

      - name: created_at
        role: dimension
        description: 商品创建时间。
        alias: [商品创建时间]
        sync: true

      - name: updated_at
        role: dimension
        description: 商品更新时间。
        alias: [商品更新时间]
        sync: false

      - name: deleted_at
        role: dimension
        description: 软删除时间。
        alias: [商品删除时间]
        sync: false

  - name: product_skus
    role: dim
    description: >
      商品 SKU 维表，规格维度的价格与可售库存真源。库存/规格销售问数优先本表；
      经 product_id 关联 products，经 order_items.sku_id 关联成交明细。
    columns:
      - name: id
        role: primary_key
        description: SKU 主键。order_items.sku_id 指向此字段（0 表示无 SKU）。
        alias: [SKU_ID, 规格ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 所属商品 ID，关联 products.id。
        alias: [所属商品ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 所属店铺 ID，关联 shops.id。
        alias: [SKU店铺ID]
        sync: false

      - name: sku_no
        role: dimension
        description: SKU 业务编码。
        alias: [SKU编码, SKU编号]
        sync: true

      - name: spec_values
        role: dimension
        description: 规格值 JSON（如颜色、规格）。
        alias: [规格值, SKU规格]
        sync: true

      - name: spec_key
        role: dimension
        description: 规格唯一键。
        alias: [规格键]
        sync: false

      - name: sale_price
        role: measure
        description: SKU 售价。
        alias: [SKU售价, 规格售价]
        sync: true

      - name: market_price
        role: measure
        description: SKU 市场价。
        alias: [SKU市场价]
        sync: true

      - name: cost_price
        role: measure
        description: SKU 成本价。
        alias: [SKU成本价]
        sync: false

      - name: stock
        role: measure
        description: SKU 可售库存（库存问数优先用此字段）。
        alias: [SKU库存, 规格库存]
        sync: true

      - name: stock_warn
        role: measure
        description: SKU 库存预警值。
        alias: [SKU库存预警]
        sync: true

      - name: barcode
        role: dimension
        description: 条形码。
        alias: [条码, 条形码]
        sync: true

      - name: status
        role: dimension
        description: SKU 状态：enabled-启用 disabled-停用。
        alias: [SKU状态]
        sync: true

      - name: sold_count
        role: measure
        description: SKU 已售数量。
        alias: [SKU销量]
        sync: true

      - name: created_at
        role: dimension
        description: SKU 创建时间。
        alias: [SKU创建时间]
        sync: false

      - name: deleted_at
        role: dimension
        description: SKU 软删除时间。
        alias: [SKU删除时间]
        sync: false

  - name: orders
    role: fact
    description: >
      订单主表（核心交易事实）。GMV/订单量/客单价等指标以此为主；成交额优先用 pay_amount（实付），
      total_amount 为订单总额汇总字段。user_id、shop_id 仅为外键 ID：按用户昵称/手机号过滤须 JOIN users，
      按店铺名或省市区过滤须 JOIN shops；不可只选本表代替维表。
    columns:
      - name: id
        role: primary_key
        description: 订单主键。order_items.order_id、售后/评价等指向此字段。
        alias: [订单ID]
        sync: false

      - name: order_no
        role: dimension
        description: 业务订单号（唯一）。按订单号查询单笔订单时使用。
        alias: [订单号, 订单编号]
        sync: true

      - name: user_id
        role: foreign_key
        description: >
          下单买家 ID，关联 users.id。仅存数字 ID，不含昵称/手机号；
          问「某用户的订单/销售额」必须同时选用 users 并用 nickname 或 mobile 定位后再关联。
        alias: [下单用户ID, 买家ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: >
          卖家店铺 ID，关联 shops.id。仅存数字 ID；
          问「某店/某地区销售额」必须同时选用 shops（name 或 province/city 等）再关联。
        alias: [订单店铺ID, 卖家店铺ID]
        sync: false

      - name: total_amount
        role: measure
        description: 订单总额（汇总字段）。用户口头「订单总额」可映射此字段；成交 GMV 更常用 pay_amount。
        alias: [订单总额, 总金额]
        sync: true

      - name: goods_amount
        role: measure
        description: 商品金额（优惠前货款合计）。
        alias: [商品金额, 货款金额]
        sync: true

      - name: discount_amount
        role: measure
        description: 优惠金额（含券等减免）。
        alias: [优惠金额, 折扣金额]
        sync: true

      - name: pay_amount
        role: measure
        description: 实付金额。统计 GMV/成交额通常对该字段 SUM，并排除 pending/failed/cancelled 等未成交状态。
        alias: [实付金额, GMV, 成交额, 支付金额, 销售额]
        sync: true

      - name: user_coupon_id
        role: foreign_key
        description: 使用的用户券 ID，关联 user_coupons.id；0 表示未用券。
        alias: [用户券ID, 用券ID]
        sync: false

      - name: receiver_name
        role: dimension
        description: 收货人姓名。
        alias: [收货人]
        sync: false

      - name: receiver_phone
        role: dimension
        description: 收货人手机号。
