        sync: false

      - name: coupon_id
        role: foreign_key
        description: 券模板 ID，关联 coupons.id。
        alias: [核销券模板ID]
        sync: false

      - name: user_id
        role: foreign_key
        description: 用户 ID，关联 users.id。
        alias: [核销用户ID]
        sync: false

      - name: order_id
        role: foreign_key
        description: 关联订单 ID，关联 orders.id。
        alias: [核销订单ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 店铺 ID，关联 shops.id。
        alias: [核销店铺ID]
        sync: false

      - name: discount_amount
        role: measure
        description: 本次抵扣金额。
