metrics:
  - name: GMV
    description: 全称 Gross Merchandise Value，成交总额。对订单实付金额求和；统计时建议排除 status 为 pending、failed、cancelled 的订单。
    relevant_columns:
      - orders.pay_amount
    alias: [成交总额, 成交额, 订单实付总额, 销售额]

  - name: AOV
    description: 全称 Average Order Value，客单价。成交订单实付金额的平均值，即 GMV / 成交订单数。
    relevant_columns:
      - orders.pay_amount
      - orders.id
    alias: [客单价, 平均订单金额, 平均客单]

  - name: OrderCount
    description: 订单量。对订单主键计数；成交订单量需结合订单状态过滤。
    relevant_columns:
      - orders.id
      - orders.status
    alias: [订单量, 订单数, 单量]

  - name: SalesQuantity
    description: 销售件数。对订单明细购买数量求和。
    relevant_columns:
      - order_items.quantity
    alias: [销量, 销售件数, 购买件数]

  - name: SalesAmount
    description: 明细销售额。订单明细单价 × 数量的合计，用于按商品/SKU 拆解销售。
    relevant_columns:
      - order_items.price
      - order_items.quantity
    alias: [明细销售额, 商品销售额]

  - name: DiscountAmount
    description: 优惠总额。订单优惠金额合计，含券等减免。
    relevant_columns:
      - orders.discount_amount
    alias: [优惠金额, 折扣总额, 减免金额]

  - name: RefundAmount
    description: 退款金额。售后单金额合计，可按售后状态过滤已退款。
    relevant_columns:
      - order_after_sales.amount
      - order_after_sales.status
    alias: [退款金额, 售后金额]

  - name: SKUStock
    description: SKU 可售库存。库存问数优先使用 product_skus.stock（库存真源）。
    relevant_columns:
      - product_skus.stock
      - product_skus.stock_warn
    alias: [库存, SKU库存, 可售库存]

  - name: ProductStock
    description: 商品级库存汇总（展示字段），精细分析请用 SKUStock。
    relevant_columns:
      - products.stock
      - products.stock_warn
    alias: [商品库存]

  - name: AvgRating
    description: 平均评分。可对评价表 rating 求平均，或直接使用商品冗余字段 avg_rating。
    relevant_columns:
      - product_reviews.rating
      - products.avg_rating
    alias: [平均评分, 商品评分, 星级均分]

  - name: ReviewCount
    description: 评价数量。
    relevant_columns:
      - product_reviews.id
      - products.review_count
    alias: [评价数, 评论数]

  - name: CouponDiscount
    description: 用券实际抵扣金额合计。
    relevant_columns:
      - user_coupons.discount_amount
      - coupon_redeem_logs.discount_amount
    alias: [用券抵扣, 券核销金额]

  - name: UserBalance
    description: 用户钱包可用余额。本系统无独立支付表，订单支付走钱包。
    relevant_columns:
      - user_wallets.balance
      - user_wallets.frozen_balance
    alias: [用户余额, 钱包余额]

  - name: ShopBalance
    description: 店铺钱包可用余额与保证金。
    relevant_columns:
      - shop_wallets.balance
      - shop_wallets.deposit
    alias: [店铺余额, 店铺保证金]
