      - name: order_id
        role: foreign_key
        description: 关联订单 ID，关联 orders.id。
        alias: [评价订单ID]
        sync: false

      - name: order_no
        role: dimension
        description: 关联业务订单号。
        alias: [评价订单号]
        sync: true

      - name: user_id
        role: foreign_key
        description: 评价用户 ID，关联 users.id；按昵称过滤须 JOIN users。
        alias: [评价用户ID]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 店铺 ID，关联 shops.id。
        alias: [评价店铺ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 商品 ID，关联 products.id；按商品名过滤须 JOIN products。
        alias: [评价商品ID]
        sync: false

      - name: sku_id
        role: foreign_key
        description: SKU ID。
        alias: [评价SKU_ID]
        sync: false

      - name: rating
