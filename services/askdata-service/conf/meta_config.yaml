        sync: true

      - name: user_identity
        role: dimension
        description: 适用用户：all/new/old。
        alias: [券适用用户]
        sync: true

      - name: status
        role: dimension
        description: 券状态：draft/on/off/expired。
        alias: [优惠券状态]
        sync: true

      - name: created_at
        role: dimension
        description: 券创建时间。
        alias: [券创建时间]
        sync: true

  - name: user_coupons
    role: fact
    description: >
      用户持有的优惠券实例。用于领券、用券、核销转化；
      关联 coupons 看模板规则，关联 users 按用户过滤，核销订单见 order_id。
