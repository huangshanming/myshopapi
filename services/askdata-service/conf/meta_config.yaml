      - name: status
        role: dimension
        description: 评价状态：visible-可见 deleted-已删。
        alias: [评价状态]
        sync: true

      - name: created_at
        role: dimension
        description: 评价时间。
        alias: [评价时间]
        sync: true

  - name: product_favorites
    role: fact
    description: >
      用户收藏商品事实表。用于收藏量、人气与收藏转化分析；
      按用户或商品名称过滤须 JOIN users / products。
