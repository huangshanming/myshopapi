  - name: order_items
    role: fact
    description: >
      订单明细（一行一个 SKU 行项目）。按商品/SKU 拆解销量与销售额时必须用本表；
      关联 orders 取买家/店铺/时间/状态，关联 products/product_skus 取当前商品属性。
    columns:
      - name: id
        role: primary_key
        description: 明细主键。
        alias: [订单明细ID, 行项目ID]
        sync: false

      - name: order_id
        role: foreign_key
        description: 所属订单 ID，关联 orders.id；取下单用户/店铺/时间需再 JOIN orders。
        alias: [所属订单ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 商品 ID，关联 products.id。按商品维属性分析时 JOIN products。
        alias: [明细商品ID]
        sync: false

      - name: sku_id
        role: foreign_key
        description: SKU ID，关联 product_skus.id；0 表示无 SKU。
        alias: [明细SKU_ID]
        sync: false

      - name: product_name
        role: dimension
        description: 下单时商品名称快照。历史成交按当时品名过滤可用此字段；当前商品名用 products.name。
        alias: [下单商品名, 商品名快照]
        sync: true

      - name: sku_snapshot
        role: dimension
        description: 下单时 SKU 规格快照。
        alias: [规格快照]
        sync: false

      - name: price
        role: measure
        description: 成交单价。
        alias: [成交单价, 明细单价]
        sync: true

      - name: quantity
        role: measure
        description: 购买数量；销量常用 SUM(quantity)。
        alias: [购买数量, 件数, 销量]
        sync: true

      - name: seckill_entry_id
        role: foreign_key
        description: 秒杀报名 ID；0 表示非秒杀单。
        alias: [秒杀报名ID, 是否秒杀]
        sync: false

      - name: created_at
        role: dimension
        description: 明细创建时间。
        alias: [明细创建时间]
        sync: true

  - name: order_after_sales
    role: fact
    description: >
      订单售后事实表（退款/退货退款）。用于售后率、退款金额分析；
      按用户/店铺维度需 JOIN users/shops，或依赖本表 user_id/shop_id 外键再关联维表。
    columns:
      - name: id
