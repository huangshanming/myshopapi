        role: primary_key
        description: 用户 ID（主键），关联 users.id。
        alias: [积分用户ID]
        sync: false

      - name: points
        role: measure
        description: 当前积分余额。
        alias: [用户积分, 积分余额]
        sync: true

      - name: updated_at
        role: dimension
        description: 更新时间。
        alias: [积分更新时间]
        sync: false

  - name: user_point_logs
    role: fact
    description: 用户积分流水，记录任务领取、人工调整等积分增减。
    columns:
      - name: id
        role: primary_key
        description: 积分流水 ID。
        alias: [积分流水ID]
        sync: false

      - name: user_id
        role: foreign_key
        description: 用户 ID，关联 users.id。
        alias: [积分流水用户ID]
        sync: false

      - name: change_type
        role: dimension
        description: 变动类型：task_claim/admin_adjust 等。
        alias: [积分变动类型]
        sync: true

      - name: delta
        role: measure
        description: 变动积分（可负）。
        alias: [积分变动值]
        sync: true

      - name: points_after
        role: measure
        description: 变动后积分。
        alias: [变动后积分]
        sync: true

      - name: remark
        role: dimension
        description: 备注。
        alias: [积分备注]
        sync: false

      - name: created_at
        role: dimension
        description: 流水时间。
        alias: [积分流水时间]
        sync: true

  - name: seckill_sessions
    role: dim
    description: 秒杀场次维表。按场次时间窗口、状态分析秒杀活动；报名商品见 seckill_entries。
    columns:
      - name: id
        role: primary_key
        description: 场次 ID。seckill_entries.session_id 指向此字段。
        alias: [秒杀场次ID]
        sync: false

      - name: rule_id
        role: foreign_key
        description: 规则 ID。
        alias: [秒杀规则ID]
        sync: false

      - name: start_at
        role: dimension
        description: 场次开始时间。
        alias: [秒杀开始时间]
        sync: true

      - name: end_at
        role: dimension
        description: 场次结束时间。
        alias: [秒杀结束时间]
        sync: true

      - name: status
        role: dimension
        description: 场次状态：active/ended。
        alias: [秒杀场次状态]
        sync: true

  - name: seckill_entries
    role: fact
    description: >
      秒杀报名商品表。分析秒杀价、秒杀库存与报名情况；
      订单明细通过 order_items.seckill_entry_id 关联本表判断是否秒杀成交。
    columns:
      - name: id
        role: primary_key
        description: 报名 ID。order_items.seckill_entry_id 指向此字段（0 表示非秒杀）。
        alias: [秒杀报名ID]
        sync: false

      - name: session_id
        role: foreign_key
        description: 场次 ID。
        alias: [所属秒杀场次]
        sync: false

      - name: shop_id
        role: foreign_key
        description: 店铺 ID。
        alias: [秒杀店铺ID]
        sync: false

      - name: product_id
        role: foreign_key
        description: 商品 ID。
        alias: [秒杀商品ID]
        sync: false

      - name: product_name
        role: dimension
        description: 报名时商品名称快照。
        alias: [秒杀商品名]
        sync: true

      - name: origin_price
        role: measure
        description: 原价。
        alias: [秒杀原价]
        sync: true

      - name: seckill_price
        role: measure
        description: 秒杀价。
        alias: [秒杀价]
        sync: true

      - name: seckill_stock
        role: measure
        description: 秒杀库存。
        alias: [秒杀库存]
        sync: true

      - name: fee_amount
        role: measure
        description: 报名费。
        alias: [秒杀报名费]
        sync: true

      - name: status
        role: dimension
        description: 报名状态，如 active。
        alias: [秒杀报名状态]
        sync: true

      - name: auto_renew
        role: dimension
        description: 是否自动续报下一场：1-是 0-否。
        alias: [秒杀自动续报]
        sync: true

      - name: created_at
        role: dimension
        description: 报名时间。
        alias: [秒杀报名时间]
        sync: true

metrics:
  - name: GMV
    description: >
      成交总额（GMV）。对 orders.pay_amount 求和；建议排除 pending/failed/cancelled。
      按用户昵称或地区下钻时须同时选用 users 或 shops，不能只靠订单外键 ID。
    relevant_columns:
      - orders.pay_amount
    alias: [成交总额, 成交额, 订单实付总额, 销售额]

  - name: AOV
    description: 客单价（AOV）= GMV / 成交订单数，即成交订单实付金额平均值。
    relevant_columns:
      - orders.pay_amount
      - orders.id
    alias: [客单价, 平均订单金额, 平均客单]

  - name: OrderCount
    description: 订单量。对 orders.id 计数；成交订单量需结合 orders.status 过滤。
    relevant_columns:
      - orders.id
      - orders.status
    alias: [订单量, 订单数, 单量]

  - name: SalesQuantity
    description: 销售件数。对 order_items.quantity 求和；按商品拆解销量时用本指标。
    relevant_columns:
      - order_items.quantity
    alias: [销量, 销售件数, 购买件数]

  - name: SalesAmount
    description: 明细销售额（单价×数量合计），按商品/SKU 拆解销售；整单成交额优先看 GMV。
    relevant_columns:
      - order_items.price
      - order_items.quantity
    alias: [明细销售额, 商品销售额]

  - name: DiscountAmount
    description: 优惠总额。对 orders.discount_amount 求和，含券等减免。
    relevant_columns:
      - orders.discount_amount
    alias: [优惠金额, 折扣总额, 减免金额]

  - name: RefundAmount
    description: 退款金额。对 order_after_sales.amount 求和，可按售后 status 过滤已退款。
    relevant_columns:
      - order_after_sales.amount
      - order_after_sales.status
    alias: [退款金额, 售后金额]

  - name: SKUStock
    description: SKU 可售库存。库存问数优先 product_skus.stock（库存真源）。
    relevant_columns:
      - product_skus.stock
      - product_skus.stock_warn
    alias: [库存, SKU库存, 可售库存]

  - name: ProductStock
    description: 商品级库存汇总（products.stock，展示字段）；精细库存请用 SKUStock。
    relevant_columns:
      - products.stock
      - products.stock_warn
    alias: [商品库存]

  - name: AvgRating
    description: 平均评分。可对 product_reviews.rating 求平均，或使用 products.avg_rating。
    relevant_columns:
      - product_reviews.rating
      - products.avg_rating
    alias: [平均评分, 商品评分, 星级均分]

  - name: ReviewCount
    description: 评价数量。可对评价表计数或使用 products.review_count。
    relevant_columns:
      - product_reviews.id
      - products.review_count
    alias: [评价数, 评论数]

  - name: CouponDiscount
    description: 用券实际抵扣金额合计，见 user_coupons / coupon_redeem_logs 的 discount_amount。
    relevant_columns:
      - user_coupons.discount_amount
      - coupon_redeem_logs.discount_amount
    alias: [用券抵扣, 券核销金额]

  - name: UserBalance
    description: 用户钱包可用余额（user_wallets.balance）。无独立支付表；按用户名查须 JOIN users。
    relevant_columns:
      - user_wallets.balance
      - user_wallets.frozen_balance
    alias: [用户余额, 钱包余额]

  - name: ShopBalance
    description: 店铺钱包可用余额与保证金（shop_wallets.balance / deposit）；按店名查须 JOIN shops。
    relevant_columns:
      - shop_wallets.balance
      - shop_wallets.deposit
    alias: [店铺余额, 店铺保证金]
      