[project]
name = "askdata-service"
version = "0.1.0"
description = "电商问数 — 自然语言查数 / analytics agent（FastAPI）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "asyncmy>=0.2.11",
    "cryptography>=46.0.7",
    "elasticsearch[async]>=8,<9",
    "fastapi[standard]>=0.115.0",
    "greenlet>=3.4.0",
    "huggingface-hub>=0.26.0",
    "jieba>=0.42.1",
    "langchain>=1.0.0",
    "langchain-deepseek>=0.1.0",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    "loguru>=0.7.3",
    "omegaconf>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.12.0",
    "sqlalchemy>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = true
