# go-zero RestConf + business fields. Compose/K8s 仍可用 MYMALL_* 覆盖。
Name: order-service.api
Host: 0.0.0.0
Port: 8883
Mode: dev
Timeout: 30000
Log:
  Mode: console
  Encoding: plain

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Username: homestead
  Password: secret
  Dbname: mymall
  Charset: utf8mb4
  MaxOpenConns: 50
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 3600

GRPC:
  UserService: localhost:9090
  CatalogService: localhost:9091
  MerchantService: localhost:9092
# Etcd:          # 非空 Hosts 时走发现（user.rpc / catalog.rpc / merchant.rpc）
#   Hosts:
#     - 127.0.0.1:2379

Redis:
  Host: 127.0.0.1
  Port: 6379
  Password: ""
  DB: 0

RabbitMQ:
  Host: 127.0.0.1
  Port: 5672
  Username: mymall
  Password: mymall
  Vhost: /
  Exchange: mymall.events

AppTelemetry:
  Enabled: false
  Endpoint: jaeger-collector.mymall:4318
  Service: order-service
