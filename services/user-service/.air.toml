root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ./cmd"
  entrypoint = ["./tmp/main"]
  full_bin = "CONFIG_PATH=./etc/user-service.yaml ./tmp/main"
  include_ext = ["go", "yaml"]
  # air ≥1.65 支持监听 root 外目录（共享包）
  include_dir = ["cmd", "internal", "etc", "../../pkg", "../../common", "../../api"]
  exclude_dir = ["tmp", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 800
  send_interrupt = true
  kill_delay = "2s"
  stop_on_error = true

[misc]
  clean_on_exit = true
