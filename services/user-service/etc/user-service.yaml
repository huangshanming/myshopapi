# go-zero RestConf + business fields. Compose/K8s 仍可用 MYMALL_* 覆盖。
Name: user-service.api
Host: 0.0.0.0
Port: 8881
Mode: dev
Timeout: 30000
Log:
  Mode: console
  Encoding: plain

RpcListenOn: 0.0.0.0:9090

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Username: homestead
  Password: secret
  Dbname: mymall
  Charset: utf8mb4
  MaxOpenConns: 50
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 3600

Auth:
  AccessSecret: fsdfascwegrgtecqwerty
  AccessExpire: 86400
  ConsumerKey: mymall-user-key
  Issuer: mymall

Telemetry:
  Enabled: false
  Endpoint: jaeger-collector.mymall:4318
  Service: user-service
