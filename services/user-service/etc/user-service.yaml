# go-zero RestConf + business fields. Compose/K8s 仍可用 MYMALL_* 覆盖。
Name: user-service.api
Host: 0.0.0.0
Port: 8881
Mode: dev
Timeout: 30000
Log:
  Mode: console
  Encoding: plain

RpcListenOn: 0.0.0.0:9090
# Etcd:          # 非空 Hosts 时向 etcd 注册 user.rpc；本地默认直连可省略
#   Hosts:
#     - 127.0.0.1:2379

MySQL:
  Host: 127.0.0.1
  Port: 3306
  Username: homestead
  Password: secret
  Dbname: mymall
  Charset: utf8mb4
  MaxOpenConns: 50
  MaxIdleConns: 10
  ConnMaxLifetime: 3600
  ConnMaxIdleTime: 3600

Auth:
  AccessSecret: fsdfascwegrgtecqwerty
  AccessExpire: 86400
  ConsumerKey: mymall-user-key
  Issuer: mymall

AppTelemetry:
  Enabled: false
  Endpoint: jaeger-collector.mymall:4318
  Service: user-service

# 聚推客联盟（优惠购）；ApiKey 也可通过 MYMALL_JUTUIKE_APIKEY 注入
Jutuike:
  ApiKey: "ZlAqOzQbKNzAiICsVrcnzgxjxztpwda0"
  BaseURL: http://api.jutuike.com
  Timeout: 8

# 好单库（优惠商品）；ApiKey/Pid/TbName 也可通过 MYMALL_HAODANKU_* 注入
Haodanku:
  ApiKey: "854F5169BC48"
  BaseURL: https://v3.api.haodanku.com
  Timeout: 8
  Pid: "淘宝推广位"
  TbName: "已授权淘宝昵称"
