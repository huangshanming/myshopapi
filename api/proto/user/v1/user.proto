syntax = "proto3";

package user.v1;

option go_package = "mymall/api/gen/user/v1;userv1";

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}

message GetUserRequest {
  uint64 user_id = 1;
}

message GetUserResponse {
  uint64 id = 1;
  string mobile = 2;
  string nickname = 3;
  int32 status = 4;
}
